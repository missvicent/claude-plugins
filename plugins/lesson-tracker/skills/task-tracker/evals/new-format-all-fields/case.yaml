schema_version: "1.1"
name: new-format-all-fields
expected_outcome: |
  A framework-bakeoff tracker.json, tracker.html and tracker.md are written. Every task has an owner (you or agent), a one-sentence goal and a check. Task 2 and 5 are by you, 1, 3 and 4 by the agent; task 3 runs as a subagent. Task 4's check asks first because it runs a local model; task 5 is a review check with a look_for list; tasks 1 and 2 are run checks. Task 2 lists data shapes (Result with answer and tool_calls). The crewai model question is an open decision, not a choice made. The HTML shows owner chips, goals, checks, a collapsed shapes-and-steps block and the open decision above the task table.
